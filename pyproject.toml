[project]
name = "ssd-life-monitor"
version = "1.1.0"
description = "A local Linux web dashboard for SSD endurance, SMART health, and temperature"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "mypy>=2.3,<3",
  "pytest>=9.0.3,<10",
  "ruff>=0.9,<1",
]

[tool.uv]
package = false
required-version = ">=0.12.3,<0.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "SIM", "UP", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
